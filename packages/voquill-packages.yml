  pipeline (version 0.3.25 at fetch); they are supporting libraries for the
  open-source desktop/mobile apps rather than client SDKs for a public API —
  Voquill publishes no public developer API, so no API client SDKs exist. The
  desktop app and CLI binaries are distributed via GitHub Releases and
  mirrored to first-party Homebrew, APT, and RPM repositories plus shell
  installers (https://voquill.com/install.sh, /install.ps1).
