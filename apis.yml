aid: voquill
name: Voquill
description: >-
  Voquill is a Y Combinator-backed company building open-source, privacy-first
  AI voice interfaces. Its flagship product is a cross-platform AI voice
  dictation app (macOS, Windows, Linux, iOS, Android) that supports local
  on-device Whisper transcription, bring-your-own API keys, Voquill Cloud, and
  self-hosted / on-premise enterprise deployments with OIDC SSO, and the
  company also builds a realtime AI scribe for pathologists that turns voice
  dictation into signed-off pathology reports inside existing LIS/IMS systems.
  The desktop app, enterprise gateway, admin portal, mobile app, and CLI are
  all developed in the open under AGPLv3 at github.com/voquill/voquill; there
  is currently no public developer API.
